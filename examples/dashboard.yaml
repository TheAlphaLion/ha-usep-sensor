# ============================================================
# USEP Singapore Electricity Price — Lovelace Dashboard
# ============================================================
# Example dashboard for the ha-usep-sensor integration.
# https://github.com/TheAlphaLion/ha-usep-sensor
#
# PREREQUISITES
# -------------
# 1. ha-usep-sensor integration installed and configured.
# 2. Four input_number helpers created in HA (Settings → Helpers):
#      input_number.usep_upper_threshold_2   (default: 500, range 0–2000)
#      input_number.usep_upper_threshold_1   (default: 300, range 0–2000)
#      input_number.usep_lower_threshold_1   (default: 150, range 0–2000)
#      input_number.usep_lower_threshold_2   (default: 100, range 0–2000)
#
# USAGE
# -----
# Option A — Raw config dashboard:
#   Settings → Dashboards → Add Dashboard → select "Start with empty dashboard"
#   Open the new dashboard → ⋮ menu → Edit → ⋮ menu → Raw configuration editor
#   Paste this file content and save.
#
# Option B — dashboards: entry in configuration.yaml:
#   dashboards:
#     usep-dashboard:
#       mode: yaml
#       filename: dashboard.yaml
#       title: USEP
#       icon: mdi:lightning-bolt
# ============================================================

title: USEP
views:
  - title: USEP
    icon: mdi:lightning-bolt
    panel: true
    cards:
      - type: vertical-stack
        cards:

          # ── CURRENT PRICES ───────────────────────────────────────────────────
          # Live snapshot of key price points for the current and upcoming
          # trading periods, plus grid demand and solar generation.
          - type: entities
            title: Current Prices
            entities:
              - entity: sensor.usep_singapore_electricity_price_usep_current
                name: USEP now
                secondary_info: last-changed
              - entity: sensor.usep_singapore_electricity_price_usep_next_period
                name: Next period
              - entity: sensor.usep_singapore_electricity_price_usep_peak_today
                name: Peak today
              - entity: sensor.usep_singapore_electricity_price_usep_lowest_today
                name: Lowest today
              - entity: sensor.usep_singapore_electricity_price_usep_peak_forecast
                name: Peak ahead
              - entity: sensor.usep_singapore_electricity_price_usep_lowest_forecast
                name: Cheapest ahead
                secondary_info: attribute
                attribute: lowest_forecast_period
              - entity: sensor.usep_singapore_electricity_price_grid_demand
                name: Grid demand
              - entity: sensor.usep_singapore_electricity_price_solar_generation
                name: Solar
              - entity: sensor.usep_singapore_electricity_price_usep_current_period
                name: Period
              - entity: sensor.usep_singapore_electricity_price_usep_data_status
                name: Data status

          # ── PRICE THRESHOLDS ─────────────────────────────────────────────────
          # Adjustable sliders that drive colour-coding in the chart and table.
          # Change these to suit your own alerting or automation logic.
          - type: entities
            title: Price Thresholds
            entities:
              - entity: input_number.usep_upper_threshold_2
                name: 🔴 Upper 2 — Extreme
              - entity: input_number.usep_upper_threshold_1
                name: 🟠 Upper 1 — High
              - entity: input_number.usep_lower_threshold_1
                name: 🟡 Lower 1 — Cheap
              - entity: input_number.usep_lower_threshold_2
                name: 🟢 Lower 2 — Very cheap

          # ── FORECAST PENDING BANNER ──────────────────────────────────────────
          # Shown only in the ~2 min window after :00/:30 while EMC confirms data.
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.usep_singapore_electricity_price_usep_data_status
                state: forecast_pending
            card:
              type: markdown
              content: |
                ⏳ **Forecast price** — confirmed EMC data arrives in ~2 min.

          # ── HIGH PRICE ALERT ─────────────────────────────────────────────────
          # Banner appears whenever USEP exceeds your Upper 1 threshold.
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.usep_singapore_electricity_price_usep_current
                above: 0
            card:
              type: markdown
              content: >
                {% set u  = states('sensor.usep_singapore_electricity_price_usep_current') | float(0) %}
                {% set u1 = states('input_number.usep_upper_threshold_1') | float(300) %}
                {% if u > u1 %}
                ## ⚡ HIGH USEP — {{ u }} $/MWh
                Above Upper Threshold 1 (${{ u1 }}/MWh). Consider deferring high-power loads.
                {% endif %}

          # ── 24 H PRICE CHART ─────────────────────────────────────────────────
          # Rolling 24-hour line chart of the USEP current sensor.
          # For a full 48-period bar chart with colour-coded bands, install
          # apexcharts-card ≥ v2.3.0 via HACS — see the repository README for
          # an ApexCharts configuration snippet.
          - type: history-graph
            title: USEP — Last 24 Hours ($/MWh)
            hours_to_show: 24
            entities:
              - entity: sensor.usep_singapore_electricity_price_usep_current
                name: USEP $/MWh

          # ── ALL PERIODS TABLE ────────────────────────────────────────────────
          # Full 48-period table for the current day, colour-coded against the
          # threshold sliders above. Thresholds update live — no page reload needed.
          - type: markdown
            title: USEP — All Periods Today
            content: >
              {% set rows = state_attr('sensor.usep_singapore_electricity_price_usep_forecast_data','forecast_table') %}
              {% set u2 = states('input_number.usep_upper_threshold_2') | float(500) %}
              {% set u1 = states('input_number.usep_upper_threshold_1') | float(300) %}
              {% set l1 = states('input_number.usep_lower_threshold_1') | float(150) %}
              {% set l2 = states('input_number.usep_lower_threshold_2') | float(120) %}
              {% if rows and rows | length > 0 %}
              <table width="100%" style="border-collapse:collapse;font-size:0.9em;">
              <tr style="border-bottom:1px solid #444;color:#888;">
                <th style="text-align:left;padding:4px 8px;">Period</th>
                <th style="text-align:right;padding:4px 8px;">USEP</th>
                <th style="text-align:right;padding:4px 8px;">Demand MW</th>
                <th style="text-align:right;padding:4px 8px;">Solar MW</th>
                <th style="text-align:center;padding:4px 8px;">Type</th>
              </tr>
              {% for r in rows %}
              {% set u = r.usep | float(0) %}
              {% if u >= u2 %}{% set badge = "🔴" %}{% set bg = "rgba(231,76,60,0.15)" %}
              {% elif u >= u1 %}{% set badge = "🟠" %}{% set bg = "rgba(230,126,34,0.15)" %}
              {% elif u <= l2 %}{% set badge = "🟢" %}{% set bg = "rgba(39,174,96,0.10)" %}
              {% elif u <= l1 %}{% set badge = "🟡" %}{% set bg = "rgba(212,172,13,0.12)" %}
              {% else %}{% set badge = "" %}{% set bg = "transparent" %}
              {% endif %}
              <tr style="border-bottom:1px solid #333;background:{{ bg }}{% if r.is_current %};font-weight:bold{% endif %};">
                <td style="padding:4px 8px;">{{ "▶ " if r.is_current else "&nbsp;&nbsp;&nbsp;" }}{{ r.period }}</td>
                <td style="text-align:right;padding:4px 8px;">{{ badge }} ${{ "%.2f" | format(u) }}</td>
                <td style="text-align:right;padding:4px 8px;">{{ r.demand if r.demand else "—" }}</td>
                <td style="text-align:right;padding:4px 8px;">{{ r.solar if r.solar else "—" }}</td>
                <td style="text-align:center;padding:4px 8px;">{{ "🔮" if r.status == "Forecast" else "✅" }}</td>
              </tr>
              {% endfor %}
              </table>
              <small style="color:#888;">
              ▶ current &nbsp; ✅ settled &nbsp; 🔮 forecast &nbsp;
              🔴 extreme (≥${{ u2 | int }}) &nbsp;
              🟠 high (≥${{ u1 | int }}) &nbsp;
              🟡 cheap (≤${{ l1 | int }}) &nbsp;
              🟢 very cheap (≤${{ l2 | int }})
              </small>
              {% else %}
              *Waiting for data — will populate at the next :02 or :32 past the hour.*
              {% endif %}

          # ── FOOTER ───────────────────────────────────────────────────────────
          - type: markdown
            content: >
              {% set ts     = state_attr('sensor.usep_singapore_electricity_price_usep_forecast_data','last_updated') %}
              {% set status = state_attr('sensor.usep_singapore_electricity_price_usep_forecast_data','data_status') %}
              {% set total  = state_attr('sensor.usep_singapore_electricity_price_usep_forecast_data','periods_total') %}
              {% set fc     = state_attr('sensor.usep_singapore_electricity_price_usep_forecast_data','periods_forecast') %}
              **Source:** EMC NEMS &nbsp;|&nbsp; **Fetches:** :02 and :32 past each hour &nbsp;|&nbsp;
              **Status:** {% if status == 'forecast_pending' %}⏳ Forecast pending{% elif status == 'confirmed' %}✅ Confirmed{% else %}⚠️ Unknown{% endif %}
              &nbsp;|&nbsp; **Periods:** {{ total if total else '—' }} total, {{ fc if fc else '—' }} forecast
              &nbsp;|&nbsp; **Last fetch:** {% if ts %}{{ ts[0:10] }} {{ ts[11:16] }} SGT{% else %}never{% endif %}
